name: 发布 Windows 安装包

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    environment: release
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 确认标签提交属于 main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "发布标签必须指向 main 已包含的提交"
          }

      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: 缓存 Rust 产物
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 发布前验证
        run: pnpm check

      - name: 检查标签与应用版本
        run: node scripts/检查版本一致.mjs "$env:GITHUB_REF_NAME"

      - name: 安装 Chromium
        run: pnpm exec playwright install chromium

      - name: 运行界面端到端测试
        run: pnpm test:e2e

      - name: 检查 Rust 格式
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: 检查 Rust 代码
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: 运行 Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: 验证 5000 条记录性能
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked performance_5000 -- --ignored --nocapture

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: node node_modules/@tauri-apps/cli/tauri.js
          args: -- --locked
          tagName: v__VERSION__
          releaseName: 综测记录 v__VERSION__
          releaseBody: |
            这是综测记录的稳定版本。请下载 NSIS 安装程序；应用内更新使用同一组已签名产物。
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: "[name]_[version]_[arch][setup][ext]"
