name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Windows 验证
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: 缓存 Rust 产物
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查前端
        run: pnpm check

      - name: 检查应用版本
        run: pnpm version:check

      - name: 安装 Chromium
        run: pnpm exec playwright install chromium

      - name: 运行界面端到端测试
        run: pnpm test:e2e

      - name: 检查 Rust 格式
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: 检查 Rust 代码
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: 运行 Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: 验证 5000 条记录性能
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked performance_5000 -- --ignored --nocapture

      - name: 构建前端
        run: pnpm build

      - name: 构建 NSIS 安装程序
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --config src-tauri/tauri.ci.conf.json -- --locked
